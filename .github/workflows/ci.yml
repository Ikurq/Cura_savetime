name: Android CI & APK Build

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Persistent Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -f "keystore.jks" ]; then
            echo "Using repository keystore.jks"
          elif [ -n "$KEYSTORE_B64" ]; then
            echo "Restoring keystore.jks from secret"
            printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
          else
            echo "Generating new persistent keystore.jks"
            keytool -genkeypair -v -keystore keystore.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey -storepass android -keypass android \
              -dname "CN=CuraSaveTime,OU=Cura,O=CuraProject,L=Tokyo,S=Tokyo,C=JP"
          fi
          ls -la keystore.jks

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --info

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK Output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 2

      - name: Upload Persistent Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: keystore.jks
          retention-days: 2

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION"

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Cura:WatchYou v${{ env.APP_VERSION }}"
          body: |
            ### Added
            - 連続使用時間に応じた自動強制休憩画面ロック機能（45分で2分間ロック）
            - 深夜帯（23:00〜06:00）における自動就寝画面ロック機能（20分で3分間ロック）
            - 画面ロック中のリアルタイムカウントダウン表示および深呼吸ガイダンス
            - 5秒長押しによる安全な緊急解除機構（解除後15分間クールダウン）
            - 端末画面OFF/ONバイパス耐性（残り時間の自動復元）
            - 設定画面での画面ロック機能トグル設定
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/debug/*.apk
